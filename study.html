<!DOCTYPE html>
<html lang="ar" dir="rtl" x-data="studyGuideApp()">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل الشرح والمذاكرة الذكية | KAADA</title>
    <link href="./KAADA-logo.png" rel="icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="./style.css">
    <link rel="manifest" href="./manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', 'Inter', sans-serif; }</style>
    <script>
        if (localStorage.getItem('kaada_auth') !== 'true') {
            window.location.replace('index.html');
        }
    </script>
</head>
<body class="bg-[#0c1410] text-slate-100 min-h-screen flex flex-col justify-between selection:bg-emerald-600 selection:text-white relative overflow-x-hidden">

    <!-- خلفيات مضيئة هادئة -->
    <div class="absolute top-0 -left-4 w-72 md:w-96 h-72 md:h-96 bg-emerald-800/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-10 -right-4 w-72 md:w-96 h-72 md:h-96 bg-emerald-900/10 rounded-full blur-3xl pointer-events-none"></div>

    <!-- نظام الإشعارات العائم -->
    <div class="fixed top-20 left-1/2 -translate-x-1/2 z-50 pointer-events-none w-full max-w-sm px-4" x-show="notification.show" x-transition>
        <div class="glass-card bg-emerald-950/95 border border-emerald-500/60 text-emerald-200 px-4 py-3 rounded-2xl shadow-2xl flex items-center gap-3 pointer-events-auto">
            <div class="w-8 h-8 rounded-xl bg-emerald-800/60 flex items-center justify-center font-bold">✓</div>
            <div class="text-xs font-semibold" x-text="notification.message"></div>
        </div>
    </div>

    <!-- الشريط العلوي (يتم حقنه تلقائياً عبر layout.js) -->
    <header class="glass-card border-b border-emerald-900/40 sticky top-0 z-50"></header>

    <!-- المحتوى الرئيسي -->
    <main class="max-w-4xl w-full mx-auto px-4 py-8 flex-grow space-y-6 z-10">
        <div class="glass-card p-6 md:p-8 rounded-3xl shadow-2xl space-y-6">
            
            <!-- أزرار المواد، زر اللغة (للمواد المحددة)، وشريط البحث -->
            <div class="flex flex-col md:flex-row gap-4 justify-between items-center border-b border-emerald-900/40 pb-4">
                <div class="flex gap-2 flex-wrap items-center">
                    <!-- أزرار المواد الخمسة -->
                    <button @click="studyGuideSubject = 'aqeedah'; searchQuery = ''" :class="studyGuideSubject === 'aqeedah' ? 'bg-emerald-700 border-emerald-500 text-white shadow' : 'bg-slate-900 border-emerald-900/60 text-slate-300'" class="px-3.5 py-2 rounded-xl text-xs font-bold border transition-all">العقيدة</button>
                    <button @click="studyGuideSubject = 'fiqh'; searchQuery = ''" :class="studyGuideSubject === 'fiqh' ? 'bg-emerald-700 border-emerald-500 text-white shadow' : 'bg-slate-900 border-emerald-900/60 text-slate-300'" class="px-3.5 py-2 rounded-xl text-xs font-bold border transition-all">الفقه والسلوك</button>
                    <button @click="studyGuideSubject = 'chem'; searchQuery = ''" :class="studyGuideSubject === 'chem' ? 'bg-emerald-700 border-emerald-500 text-white shadow' : 'bg-slate-900 border-emerald-900/60 text-slate-300'" class="px-3.5 py-2 rounded-xl text-xs font-bold border transition-all">Chemistry</button>
                    <button @click="studyGuideSubject = 'math'; searchQuery = ''" :class="studyGuideSubject === 'math' ? 'bg-emerald-700 border-emerald-500 text-white shadow' : 'bg-slate-900 border-emerald-900/60 text-slate-300'" class="px-3.5 py-2 rounded-xl text-xs font-bold border transition-all">Math</button>
                    <button @click="studyGuideSubject = 'comp'; searchQuery = ''" :class="studyGuideSubject === 'comp' ? 'bg-emerald-700 border-emerald-500 text-white shadow' : 'bg-slate-900 border-emerald-900/60 text-slate-300'" class="px-3.5 py-2 rounded-xl text-xs font-bold border transition-all">Computer</button>

                    <!-- 🌐 زر تبديل اللغة يظهر فقط للرياضيات، الكيمياء، والحاسب -->
                    <button x-show="studyGuideSubject === 'chem' || studyGuideSubject === 'math' || studyGuideSubject === 'comp'" 
                            @click="toggleStudyLang()" 
                            class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-emerald-900/60 text-xs font-bold text-emerald-300 transition-all shadow flex items-center gap-1">
                        <span>🌐</span>
                        <span x-text="guideLang === 'ar' ? 'English' : 'العربية'"></span>
                    </button>
                </div>

                <div class="w-full md:w-64">
                    <input type="text" x-model="searchQuery" placeholder="بحث في المفاهيم والشروحات..." class="w-full bg-slate-900 border border-emerald-900/60 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500 shadow-inner">
                </div>
            </div>

            <!-- بطاقات المذاكرة والشرح -->
            <div class="space-y-4">
                <template x-for="(qItem, qIdx) in filteredStudyQuestions" :key="qIdx">
                    <div class="p-5 rounded-2xl bg-slate-900/90 border border-emerald-900/50 space-y-3 shadow-xl">
                        <div class="flex justify-between items-center text-xs text-slate-400 font-mono">
                            <span class="text-emerald-400 font-bold" x-text="'مفهوم رقم #' + (qIdx + 1)"></span>
                            <button @click="toggleBookmark(qItem)" class="px-2.5 py-1 rounded-lg text-xs border transition-colors flex items-center gap-1"
                                    :class="isBookmarked(qItem) ? 'bg-amber-500/20 text-amber-300 border-amber-500/40' : 'bg-slate-800 text-slate-400 border-slate-700'">
                                ⭐ <span x-text="isBookmarked(qItem) ? 'محفوظ' : 'حفظ'"></span>
                            </button>
                        </div>
                        <h4 class="text-sm md:text-base font-bold text-white leading-relaxed" x-text="qItem.q"></h4>
                        
                        <!-- خيارات الإجابة -->
                        <div class="grid sm:grid-cols-2 gap-2 pt-1">
                            <template x-for="(optText, optIdx) in qItem.options" :key="optIdx">
                                <div class="p-2.5 rounded-xl border text-xs flex items-center justify-between"
                                     :class="optIdx === qItem.correct ? 'bg-emerald-950/50 border-emerald-500/60 text-emerald-200 font-bold' : 'bg-slate-950/40 border-slate-800 text-slate-400'">
                                    <span x-text="optText"></span>
                                    <span class="font-mono opacity-70" x-text="String.fromCharCode(65 + optIdx)"></span>
                                </div>
                            </template>
                        </div>

                        <!-- الشرح العلمي المفصل -->
                        <div class="bg-emerald-950/30 border border-emerald-500/40 p-4 rounded-xl space-y-1.5 mt-2">
                            <p class="font-bold text-emerald-300 text-xs">💡 الشرح العلمي والفهم العميق:</p>
                            <p class="text-slate-200 leading-relaxed text-xs md:text-sm" x-text="qItem.explanation"></p>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </main>

    <!-- ذيل الصفحة (يتم حقنه تلقائياً عبر layout.js) -->
    <footer class="glass-card border-t border-emerald-900/50 mt-12 py-6 text-xs text-slate-400 text-center z-10"></footer>

    <!-- ربط السكربتات بالترتيب الصحيح -->
    <script src="./notifications.js?v=2026.10.9"></script>
    <script src="./aqeedah.js?v=2026.10.9"></script>
    <script src="./chemistry.js?v=2026.10.9"></script>
    <script src="./math.js?v=2026.10.9"></script>
    <script src="./computer.js?v=2026.10.9"></script>
    <script src="./fiqh.js?v=2026.10.9"></script>
    <script>
        const quizzesData = {
            aqeedah: {
                ...aqeedahData,
                arabicOnly: true,
                category: "العقيدة الإسلامية",
                title: "منهج العقيدة للكليات العسكرية"
            },
            fiqh: {
                ...fiqhData,
                arabicOnly: true,
                category: "الفقه والسلوك",
                title: "مقرر الفقه والسلوك للكليات العسكرية"
            },
            chem: chemistryData,
            math: mathData,
            comp: computerData
        };
    </script>
    <script src="./study-guide.js?v=2026.10.9"></script>
    <script src="./layout.js?v=2026.10.9"></script>
    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(() => console.log('Service Worker Registered!'))
                .catch((err) => console.log('SW Registration Failed:', err));
        });
    }
    </script>
</body>
</html>
