<!DOCTYPE html>
<html lang="ar" dir="rtl" x-data="{ lang: 'ar', toggleLang() { this.lang = this.lang === 'ar' ? 'en' : 'ar'; document.documentElement.setAttribute('dir', this.lang === 'ar' ? 'rtl' : 'ltr'); document.documentElement.setAttribute('lang', this.lang); } }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="منصة الاختبارات والمذاكرة الذكية | كلية الملك عبدالله للدفاع الجوي" />
    <meta property="og:description" content="King Abdullah Air Defense Academy" />
    <meta property="og:image" content="./KAADA-logo.png" />
    <meta property="og:url" content="https://kaada-q.netlify.app/" />
    <meta property="og:type" content="website" />
    <title x-text="lang === 'ar' ? 'تسجيل الدخول | منصة الاختبارات والمذاكرة الذكية' : 'Login | Smart Quiz & Study Hub'">تسجيل الدخول - منصة الاختبارات والمذاكرة الذكية</title>
    <link href="./KAADA-logo.png" rel="icon">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="./manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', 'Inter', sans-serif; }
        .glass-card {
            background: rgba(15, 28, 20, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(16, 185, 129, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
    </style>
    <script>
        // التحقق مما إذا كان المستخدم مسجل الدخول مسبقاً
        if (localStorage.getItem('kaada_auth') === 'true') {
            window.location.replace('home.html');
        }

        // نظام تسجيل الدخول الآمن والمخفي
        function secureHiddenLogin() {
            return {
                inputPass: '',
                showError: false,
                
                verifyAccess() {
                    // الشفرة السرية (Base64) الخاصة بكلمة المرور: KAADA-c25
                    const encodedSecret = "S0FBREEtYzI1"; 
                    
                    const userEncoded = btoa(this.inputPass.trim());
                    
                    if (userEncoded === encodedSecret) {
                        localStorage.setItem('kaada_auth', 'true');
                        window.location.replace('home.html');
                    } else {
                        this.showError = true;
                        this.inputPass = '';
                    }
                }
            }
        }
    </script>
    <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then((reg) => {
          console.log('Service Worker registered successfully!', reg.scope);
        })
        .catch((err) => {
          console.log('Service Worker registration failed:', err);
        });
    });
  }
</script>
</head>
<body class="bg-[#0c1410] text-slate-100 min-h-screen flex flex-col justify-between selection:bg-emerald-600 selection:text-white relative overflow-x-hidden">

    <!-- خلفيات مضيئة هادئة مريحة للعين -->
    <div class="absolute top-0 -left-4 w-72 md:w-96 h-72 md:h-96 bg-emerald-800/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-10 -right-4 w-72 md:w-96 h-72 md:h-96 bg-emerald-900/10 rounded-full blur-3xl pointer-events-none"></div>

    <!-- زر تغيير اللغة العائم في الأعلى -->

    <!-- المحتوى الرئيسي لتسجيل الدخول -->
    <main class="max-w-md w-full mx-auto px-4 py-12 flex-grow flex flex-col justify-center z-10" x-data="secureHiddenLogin()">
        <div class="glass-card p-8 rounded-3xl shadow-2xl space-y-6 border border-emerald-500/30 text-center relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-emerald-600/10 rounded-full blur-2xl pointer-events-none"></div>
            
            <div class="w-20 h-20 bg-emerald-600/10 border border-emerald-500/40 rounded-2xl mx-auto flex items-center justify-center text-3xl shadow-lg text-emerald-400 font-bold">
                🔒
            </div>

            <div class="space-y-2">
                <span class="bg-emerald-600/10 text-emerald-400 border border-emerald-600/30 text-xs px-3 py-1 rounded-full font-bold inline-block">
                    <span x-text="lang === 'ar' ? 'بوابة أمنة وخاصة' : 'Secure Portal'">بوابة آمنة وخاصة</span>
                </span>
                <h2 class="text-xl md:text-2xl font-black text-white" x-text="lang === 'ar' ? 'تسجيل دخول الطلبة' : 'Student Login'">تسجيل دخول الطلبة</h2>
                <p class="text-slate-400 text-xs leading-relaxed" x-text="lang === 'ar' ? 'الرجاء إدخال رمز المرور المعتمد للوصول إلى محتوى المنصة واختبارات المواد.' : 'Please enter authorized password to access.'">أدخل رمز المرور المعتمد للوصول.</p>
            </div>

            <form @submit.prevent="verifyAccess()" class="space-y-4 pt-2">
                <div>
                    <input type="password" 
                           x-model="inputPass" 
                           :placeholder="lang === 'ar' ? 'أدخل رمز المرور السرّي...' : 'Enter password...'"
                           class="w-full bg-slate-900 border border-emerald-900/60 rounded-xl px-4 py-3 text-xs md:text-sm text-white focus:outline-none focus:border-emerald-500 text-center tracking-widest shadow-inner">
                </div>

                <div x-show="showError" x-transition class="text-red-400 text-xs font-bold bg-red-950/40 border border-red-500/30 p-2.5 rounded-xl">
                    <span x-text="lang === 'ar' ? '⚠️ رمز المرور غير صحيح، حاول مجدداً.' : '⚠️ Incorrect password, try again.'">رمز المرور غير صحيح</span>
                </div>

                <button type="submit" class="w-full py-3 bg-gradient-to-r from-emerald-700 to-emerald-900 text-white font-bold rounded-xl shadow-lg shadow-emerald-900/40 text-xs md:text-sm transition-all hover:scale-[1.02]">
                    <span x-text="lang === 'ar' ? 'دخول المنصة &larr;' : 'Access Hub &larr;'">دخول المنصة</span>
                </button>
            </form>
        </div>
    </main>

    <!-- ذيل الصفحة (Footer) -->
    <footer class="glass-card border-t border-emerald-900/50 py-6 text-xs text-slate-400 z-10 text-center">
        <div class="max-w-6xl mx-auto px-4 space-y-1">
            <p class="font-bold text-emerald-400 text-xs">
                <span x-text="lang === 'ar' ? 'إشراف: ' : 'Supervised by: '"></span>
                <span class="text-white font-black">هزاع الهزاع</span>
            </p>
            <p class="text-[10px] text-slate-400" x-text="lang === 'ar' ? 'جميع الحقوق محفوظة © 2026 - كلية الملك عبدالله للدفاع الجوي' : 'All Rights Reserved © 2026 - KAADA'"></p>
        </div>
    </footer>
</body>
</html>
