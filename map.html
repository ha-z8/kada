                { "type": "Feature", "geometry": { "type": "Polygon", "coordinates": [[[40.577939, 21.494725], [40.57746, 21.494416], [40.578038, 21.493721], [40.578526, 21.494095], [40.577939, 21.494725]]] }, "properties": { "title_ar": "الثقافة", "title_en": "Cultural Center", "fill": "#005e38" }, "id": 2440854184 },
                { "type": "Feature", "geometry": { "type": "Polygon", "coordinates": [[[40.580331, 21.497551], [40.57963, 21.496342], [40.580404, 21.495861], [40.581184, 21.497116], [40.580331, 21.497551]]] }, "properties": { "title_ar": "المواقف الترابيه", "title_en": "Dirt Parking", "fill": "#444444" }, "id": 2662085898 },
                { "type": "Feature", "geometry": { "type": "Polygon", "coordinates": [[[40.579652, 21.496309], [40.578923, 21.495127], [40.579638, 21.494584], [40.580426, 21.495813], [40.579652, 21.496309]]] }, "properties": { "title_ar": "المواقف", "title_en": "Parking", "fill": "#444444" }, "id": 2546672364 },
                { "type": "Feature", "geometry": { "type": "Polygon", "coordinates": [[[40.578905, 21.494337], [40.579046, 21.494453], [40.578993, 21.494517], [40.57908, 21.494594], [40.578933, 21.494822], [40.578659, 21.494632], [40.578905, 21.494337]]] }, "properties": { "title_ar": "بوابة الكلية", "title_en": "Academy Gate", "fill": "#444444" }, "id": 2569673305 },
                { "type": "Feature", "geometry": { "type": "Polygon", "coordinates": [[[40.575194, 21.495985], [40.57451, 21.49561], [40.575543, 21.494344], [40.576155, 21.494795], [40.575194, 21.495985]]] }, "properties": { "title_ar": "الملعب الرياضي", "title_en": "Sports Field", "fill": "#3cc954" }, "id": 792574375 },
                { "type": "Feature", "geometry": { "coordinates": [[[40.574094, 21.497999], [40.57422, 21.497837], [40.574131, 21.497776], [40.573994, 21.497935], [40.574094, 21.497999]]], "type": "Polygon" }, "properties": { "title_ar": "مكتب ضابط خفر", "title_en": "Duty Officer Office", "fill": "#005e38" }, "id": 3802040487 }
            ]
        };

        let mapInstance = null;
        let geoJsonLayer = null;
        let featureLayers = {};
        let activeColorFilter = 'all';

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                if (document.getElementById('map')) {
                    mapInstance = L.map('map').setView([21.497, 40.575], 16);

                    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                        maxZoom: 19,
                        attribution: 'GIS &copy; Esri'
                    }).addTo(mapInstance);

                    buildMapLayers();
                    renderFacilityList(facilityData.features);
                }
            }, 200);
        });

        function buildMapLayers() {
            if (geoJsonLayer) {
                mapInstance.removeLayer(geoJsonLayer);
            }

            const currentLang = document.documentElement.getAttribute('lang') || 'ar';

            geoJsonLayer = L.geoJSON(facilityData, {
                style: function (feature) {
                    return {
                        color: feature.properties.fill || '#10b981',
                        weight: 2,
                        fillColor: feature.properties.fill || '#10b981',
                        fillOpacity: 0.65
                    };
                },
                onEachFeature: function (feature, layer) {
                    if (feature.properties) {
                        featureLayers[feature.id] = layer;
                        const title = currentLang === 'ar' ? feature.properties.title_ar : feature.properties.title_en;

                        layer.bindTooltip(title, {
                            permanent: true,
                            direction: 'center',
                            className: 'custom-tooltip'
                        });

                        layer.on('click', function () {
                            selectFeatureOnMap(feature.id, title);
                        });
                    }
                }
            }).addTo(mapInstance);

            try {
                mapInstance.fitBounds(geoJsonLayer.getBounds());
            } catch(e) {}
            mapInstance.invalidateSize();
        }

        function updateMapLanguage() {
            buildMapLayers();
            filterFacilityList();
            
            const currentLang = document.documentElement.getAttribute('lang') || 'ar';
            const selectedTitleElem = document.getElementById('selected-title');
            if (selectedTitleElem.innerText.includes('اختر') || selectedTitleElem.innerText.includes('Select')) {
                selectedTitleElem.innerText = currentLang === 'ar' ? 'اختر معلماً من القائمة أو الخريطة' : 'Select a facility from list or map';
            }
        }

        function renderFacilityList(features) {
            const listContainer = document.getElementById('facilities-list');
            listContainer.innerHTML = '';
            const currentLang = document.documentElement.getAttribute('lang') || 'ar';
            
            features.forEach(feat => {
                const title = currentLang === 'ar' ? feat.properties.title_ar : feat.properties.title_en;
                const id = feat.id.toString();
                const color = feat.properties.fill || '#10b981';

                const btn = document.createElement('button');
                btn.className = "w-full text-right p-2 rounded-xl bg-slate-900/80 hover:bg-slate-800 border border-emerald-900/40 text-xs font-semibold text-slate-300 transition-all flex items-center justify-between group";
                btn.innerHTML = `
                    <span class="group-hover:text-emerald-300 truncate">${title} <span class="text-[9px] text-slate-500 font-mono">(#${id})</span></span>
                    <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background-color: ${color}"></span>
                `;
                btn.onclick = () => selectFeatureOnMap(id, title);
                listContainer.appendChild(btn);
            });

            document.getElementById('facilities-count').innerText = features.length + (currentLang === 'ar' ? ' موقعاً' : ' locations');
        }

        function selectFeatureOnMap(id, title) {
            const currentLang = document.documentElement.getAttribute('lang') || 'ar';
            document.getElementById('selected-title').innerText = title;
            document.getElementById('selected-id').innerText = (currentLang === 'ar' ? "معرف النظام (ID): " : "System ID: ") + id;

            const layer = featureLayers[id];
            if (layer && mapInstance) {
                if (layer.getBounds) {
                    mapInstance.fitBounds(layer.getBounds(), { maxZoom: 18 });
                } else if (layer.getLatLng) {
                    mapInstance.setView(layer.getLatLng(), 18);
                }
                layer.openPopup ? layer.openPopup() : layer.fire('click');
            }
        }

        function filterFacilityList() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const currentLang = document.documentElement.getAttribute('lang') || 'ar';
            
            const filtered = facilityData.features.filter(f => {
                const name = currentLang === 'ar' ? f.properties.title_ar.toLowerCase() : f.properties.title_en.toLowerCase();
                const matchQuery = name.includes(query) || f.id.toString().includes(query);
                const matchColor = activeColorFilter === 'all' || f.properties.fill === activeColorFilter;
                return matchQuery && matchColor;
            });
            renderFacilityList(filtered);
        }

        function filterByColor(colorHex) {
            activeColorFilter = colorHex;
            filterFacilityList();
        }

        function resetMapView() {
            if (mapInstance && geoJsonLayer) {
                mapInstance.fitBounds(geoJsonLayer.getBounds());
            }
        }

        function forceSyncUpdate() {
            const currentLang = document.documentElement.getAttribute('lang') || 'ar';
            if (navigator.serviceWorker) {
                navigator.serviceWorker.getRegistrations().then((registrations) => {
                    for (let registration of registrations) {
                        registration.unregister();
                    }
                    caches.keys().then((names) => {
                        for (let name of names) {
                            caches.delete(name);
                        }
                        alert(currentLang === 'ar' ? '✨ تم مسح الذاكرة المؤقتة ومزامنة أحدث إصدار بنجاح!' : '✨ Cache cleared and latest version synced successfully!');
                        window.location.reload(true);
                    });
                });
            } else {
                window.location.reload(true);
            }
        }
    </script>
